<title>FOHAT | Gestão de Demandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.9/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f4f6f7;
    --surface:#ffffff;
    --surface-2:#eef1f3;
    --surface-3:#e6eaed;
    --border:#dfe4e8;
    --border-strong:#c7cfd6;
    --text:#1b2430;
    --text-2:#5f6b78;
    --text-3:#8993a1;
    --accent:#1f6f5c;
    --accent-ink:#ffffff;
    --accent-soft:#e2efec;
    --focus:#1f6f5c;
    --shadow: 0 1px 2px rgba(20,30,40,.05), 0 8px 24px -14px rgba(20,30,40,.22);
    --shadow-lg: 0 24px 60px -24px rgba(15,20,25,.35);

    --slate:#6d7889;   --slate-soft:#eaedf1;
    --blue:#2e6fa3;    --blue-soft:#e4edf5;
    --violet:#7a5fc0;  --violet-soft:#ece7f8;
    --amber:#b3791c;   --amber-soft:#faf0dc;
    --bronze:#8a6d3c;  --bronze-soft:#f1e9da;
    --crimson:#c6392f; --crimson-soft:#fbe6e4;
    --cyan:#2f8fa0;    --cyan-soft:#e1eff1;
    --green:#2f8f5b;   --green-soft:#e3f3ea;
    --red:#d1352b;     --red-soft:#fbe1df;
    --orange:#c65a1f;  --orange-soft:#f9e7db;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1318; --surface:#181e26; --surface-2:#1f2630; --surface-3:#262e39;
      --border:#2a323d; --border-strong:#3a4451;
      --text:#e9edf1; --text-2:#a7b2bd; --text-3:#7c8794;
      --accent:#4fb69a; --accent-ink:#08201a; --accent-soft:#183028; --focus:#4fb69a;
      --slate:#93a0ae;  --slate-soft:#242c36;
      --blue:#6ba7d6;   --blue-soft:#1c2a36;
      --violet:#a693e0; --violet-soft:#251f38;
      --amber:#e0aa4c;  --amber-soft:#332813;
      --bronze:#c7a876; --bronze-soft:#2c2617;
      --crimson:#e2685d;--crimson-soft:#33201d;
      --cyan:#5cb6c7;   --cyan-soft:#152a2d;
      --green:#5cc290;  --green-soft:#173226;
      --red:#e9584c;    --red-soft:#331d1a;
      --orange:#e08a54; --orange-soft:#332217;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1318; --surface:#181e26; --surface-2:#1f2630; --surface-3:#262e39;
    --border:#2a323d; --border-strong:#3a4451;
    --text:#e9edf1; --text-2:#a7b2bd; --text-3:#7c8794;
    --accent:#4fb69a; --accent-ink:#08201a; --accent-soft:#183028; --focus:#4fb69a;
    --slate:#93a0ae;  --slate-soft:#242c36;
    --blue:#6ba7d6;   --blue-soft:#1c2a36;
    --violet:#a693e0; --violet-soft:#251f38;
    --amber:#e0aa4c;  --amber-soft:#332813;
    --bronze:#c7a876; --bronze-soft:#2c2617;
    --crimson:#e2685d;--crimson-soft:#33201d;
    --cyan:#5cb6c7;   --cyan-soft:#152a2d;
    --green:#5cc290;  --green-soft:#173226;
    --red:#e9584c;    --red-soft:#331d1a;
    --orange:#e08a54; --orange-soft:#332217;
  }

  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif;
    font-size:13.5px; line-height:1.45;
  }
  h1,h2,h3,h4{font-family:"Libre Franklin","Public Sans",sans-serif; text-wrap:balance; margin:0;}
  button,input,select,textarea{font-family:inherit; color:inherit;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  svg{display:block;}

  /* ---------------- App shell ---------------- */
  .app{display:flex; height:100%; overflow:hidden;}

  /* Sidebar */
  .sidebar{
    width:230px; flex:0 0 230px;
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition:width .15s ease;
    z-index:30;
  }
  .sidebar.collapsed{width:66px; flex-basis:66px;}
  .sidebar-top{
    display:flex; align-items:center; gap:9px; padding:16px 14px 14px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-logo{
    display:flex; align-items:center; flex:0 0 auto;
  }
  .sidebar-logo img{height:30px; width:auto; display:block;}
  .sidebar-brandtext{overflow:hidden;}
  .sidebar-brandtext b{display:block; font-size:13px; font-weight:800; letter-spacing:.02em; white-space:nowrap;}
  .sidebar-brandtext span{display:block; font-size:10px; color:var(--text-3); white-space:nowrap;}
  .sidebar.collapsed .sidebar-brandtext{display:none;}

  .sidebar-nav{flex:1 1 auto; overflow-y:auto; padding:10px 10px;}
  .sidebar-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); padding:12px 10px 6px;}
  .sidebar-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:8px; margin-bottom:2px;
    color:var(--text-2); font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid transparent; white-space:nowrap; overflow:hidden;
    background:none; width:100%; text-align:left;
  }
  .sidebar-item .ic{flex:0 0 auto; width:17px; height:17px; color:var(--text-3);}
  .sidebar-item:hover{background:var(--surface-2); color:var(--text);}
  .sidebar-item.active{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
  .sidebar-item.active .ic{color:var(--accent);}
  .sidebar-item .badge-count{
    margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px;
    background:var(--surface-3); color:var(--text-2); border-radius:20px; padding:1px 6px;
  }
  .sidebar-item.active .badge-count{background:var(--surface); color:var(--accent);}
  .sidebar.collapsed .sidebar-item span.label, .sidebar.collapsed .badge-count{display:none;}
  .sidebar.collapsed .sidebar-item{justify-content:center;}
  .sidebar.collapsed .sidebar-section-label{display:none;}

  .sidebar-bottom{border-top:1px solid var(--border); padding:10px;}
  .sidebar-collapse-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:7px; border-radius:8px; border:1px solid var(--border-strong);
    background:transparent; color:var(--text-2); font-size:12px; cursor:pointer; margin-top:4px;
  }
  .sidebar-collapse-btn:hover{background:var(--surface-2);}

  .sidebar-scrim{position:fixed; inset:0; background:rgba(10,14,18,.45); z-index:29; display:none;}
  @media (max-width: 880px){
    .sidebar{position:fixed; top:0; bottom:0; left:0; transform:translateX(-100%); transition:transform .18s ease; box-shadow:var(--shadow-lg);}
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar-scrim.show{display:block;}
    .sidebar-collapse-btn{display:none;}
  }

  /* Header */
  .main-col{flex:1 1 auto; display:flex; flex-direction:column; min-width:0;}
  .topheader{
    height:60px; flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:0 18px; position:relative; z-index:20;
  }
  .hamburger{display:none; background:none; border:none; color:var(--text-2); cursor:pointer; padding:6px;}
  @media (max-width:880px){.hamburger{display:flex;}}
  .breadcrumb{font-size:12.5px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;}
  .breadcrumb b{color:var(--text); font-weight:700;}
  .header-search{position:relative; flex:1 1 auto; max-width:360px; margin-left:6px;}
  .header-search input{
    width:100%; padding:8px 10px 8px 32px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg); font-size:13px;
  }
  .header-search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-3);}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); overflow:hidden; z-index:50;
    max-height:340px; overflow-y:auto;
  }
  .search-results .sr-group-label{padding:8px 12px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3);}
  .search-results .sr-item{padding:8px 12px; cursor:pointer; display:flex; flex-direction:column; gap:1px;}
  .search-results .sr-item:hover{background:var(--surface-2);}
  .search-results .sr-item b{font-size:12.5px;}
  .search-results .sr-item span{font-size:11px; color:var(--text-3);}
  .search-empty{padding:16px; text-align:center; color:var(--text-3); font-size:12.5px;}

  .spacer{flex:1 1 auto;}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .iconbtn{
    width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid transparent; color:var(--text-2); cursor:pointer; position:relative; flex:0 0 auto;
  }
  .iconbtn:hover{background:var(--surface-2); border-color:var(--border);}
  .iconbtn .dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid var(--surface);}

  .dropdown{
    position:absolute; top:calc(100% + 8px); right:0; width:320px; background:var(--surface);
    border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); z-index:60; overflow:hidden;
  }
  .dropdown-head{padding:12px 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:13px;}
  .dropdown-body{max-height:320px; overflow-y:auto;}
  .notif-item{padding:10px 14px; border-bottom:1px solid var(--border); font-size:12.5px; display:flex; gap:9px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--surface-2); cursor:pointer;}
  .notif-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex:0 0 auto;}
  .notif-item .t{color:var(--text-3); font-size:10.5px; margin-top:2px;}

  .user-chip{display:flex; align-items:center; gap:8px; cursor:pointer; padding:4px 8px 4px 4px; border-radius:20px; border:1px solid transparent;}
  .user-chip:hover{background:var(--surface-2); border-color:var(--border);}
  .user-chip .name{font-size:12.5px; font-weight:700;}
  .user-chip .role{font-size:10.5px; color:var(--text-3); margin-top:-2px;}
  .user-menu .um-item{padding:9px 14px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:8px;}
  .user-menu .um-item:hover{background:var(--surface-2);}
  .user-menu .um-item .ic{width:15px; height:15px; color:var(--text-3);}

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.07);}
  .btn.secondary{background:transparent; color:var(--text); border-color:var(--border-strong); font-weight:600;}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--text-2);}
  .btn.danger{background:transparent; border-color:var(--crimson); color:var(--crimson); font-weight:700;}
  .btn.sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* Content area */
  .content{flex:1 1 auto; overflow-y:auto; padding:22px 26px 60px;}
  .content-narrow{max-width:1180px; margin:0 auto;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .page-head h1{font-size:21px; font-weight:800; letter-spacing:-.01em;}
  .page-head p{color:var(--text-2); font-size:13px; margin-top:4px;}

  /* Stat tiles */
  .stat-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:22px;}
  @media (max-width:1100px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:600px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 14px 12px;
    display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow);
  }
  .stat-tile .st-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-tile .st-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .stat-tile .st-icon svg{width:16px; height:16px;}
  .stat-tile .st-value{font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:600; letter-spacing:-.02em;}
  .stat-tile .st-label{font-size:11.5px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

  /* Cards / panels */
  .panel-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}
  .panel-card .pc-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border);}
  .panel-card .pc-head h3{font-size:14px; font-weight:700;}
  .two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start;}
  .two-col > *{min-width:0;}
  @media (max-width:980px){.two-col{grid-template-columns:1fr;}}
  .content-narrow{min-width:0;}
  .pj-meta-row, .card-meta-row{min-width:0;}
  .pj-meta-row span, .stat-tile, .panel-card{min-width:0;}

  /* Project cards grid */
  .project-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}
  .project-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px;
    box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:10px;
    border-top:3px solid var(--slate);
  }
  .project-card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .project-card .pj-title{font-size:14.5px; font-weight:800; line-height:1.25;}
  .project-card .pj-client{font-size:11.5px; color:var(--text-3);}
  .project-card .pj-meta-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px;}
  .project-card .pj-progress-row{display:flex; align-items:center; gap:8px;}
  .project-card .pj-progress-row .num{font-size:11.5px; color:var(--text-2); flex:0 0 auto; width:32px; text-align:right;}
  .project-card .pj-footer{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .project-card .pj-due{font-size:11px; color:var(--text-3);}
  .project-card .pj-due.overdue{color:var(--red); font-weight:700;}
  .project-card.selected{border-color:var(--crimson); box-shadow:0 0 0 2px var(--crimson-soft), var(--shadow);}
  .pj-select-dot{background:none; border:none; padding:3px; cursor:pointer; flex:0 0 auto; margin-top:2px;}
  .dot-ring{display:block; width:14px; height:14px; border-radius:50%; border:2px solid var(--border-strong); box-sizing:border-box;}
  .dot-ring.on{border-color:var(--crimson); background:var(--crimson);}

  /* Pills */
  .pill{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .pill-dropdown-wrap{position:relative; display:inline-block;}
  .pill-btn{border:none; cursor:pointer;}
  .pill-menu{position:absolute; top:calc(100% + 5px); left:0; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; box-shadow:var(--shadow-lg); z-index:70; min-width:170px; overflow:hidden; padding:4px;}
  .pill-menu .pm-item{padding:6px 9px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:7px;}
  .pill-menu .pm-item:hover{background:var(--surface-2);}

  /* Avatar */
  .avatar{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex:0 0 auto;}
  .avatar-name{display:flex; align-items:center; gap:7px; overflow:hidden;}
  .avatar-name .an-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:600;}

  /* Progress bar */
  .progress-track{flex:1 1 auto; height:6px; border-radius:20px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:20px;}

  /* Filter bar */
  .filter-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-bar select, .filter-bar .fb-search input{
    padding:7px 9px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); font-size:12.5px;
  }
  .fb-search{position:relative;}
  .fb-search input{padding-left:28px; width:190px;}
  .fb-search svg{position:absolute; left:8px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text-3);}
  .view-toggle{display:flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden;}
  .view-toggle button{padding:7px 11px; background:var(--surface); border:none; font-size:12px; font-weight:700; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:5px;}
  .view-toggle button.active{background:var(--accent); color:var(--accent-ink);}

  /* Table */
  .table-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}
  table.demandas{width:100%; border-collapse:collapse; min-width:920px;}
  table.demandas th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3);
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; cursor:pointer; user-select:none;
  }
  table.demandas th:hover{color:var(--text-2);}
  table.demandas td{padding:9px 12px; border-bottom:1px solid var(--border); font-size:12.5px; vertical-align:middle;}
  table.demandas tbody tr:last-child td{border-bottom:none;}
  table.demandas tbody tr{cursor:pointer;}
  table.demandas tbody tr:hover{background:var(--surface-2);}
  table.demandas td.tt{font-weight:700; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  table.demandas td .proj-tag{font-size:11px; color:var(--text-3);}
  .sort-caret{display:inline-block; margin-left:3px; opacity:.6; font-size:9px;}
  .row-progress{display:flex; align-items:center; gap:7px; width:110px;}

  /* Kanban */
  .kanban-scroll{overflow-x:auto; padding-bottom:8px;}
  .kanban-board{display:flex; gap:12px; min-width:max-content;}
  .kanban-col{width:266px; flex:0 0 266px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; max-height:calc(100vh - 300px);}
  .kanban-col.dragover{outline:2px dashed var(--accent); outline-offset:-2px;}
  .kanban-col-head{display:flex; align-items:center; gap:7px; padding:11px 11px 8px;}
  .kanban-col-head h4{font-size:12.5px; font-weight:800;}
  .kanban-count{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:1px 7px;}
  .kanban-col-body{flex:1 1 auto; overflow-y:auto; padding:2px 9px 9px; display:flex; flex-direction:column; gap:8px;}
  .kanban-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--slate); border-radius:9px; padding:9px 10px; cursor:grab; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;}
  .kanban-card.dragging{opacity:.4;}
  .kanban-card .kc-title{font-size:12.5px; font-weight:700; line-height:1.3;}
  .kanban-card .kc-proj{font-size:10.5px; color:var(--text-3);}
  .kanban-card .kc-footer{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .kanban-card .kc-due{font-size:10.5px; font-family:"JetBrains Mono",monospace; color:var(--text-3);}
  .kanban-card .kc-due.overdue{color:var(--red); font-weight:700;}
  .col-empty{color:var(--text-3); font-size:11.5px; text-align:center; padding:18px 8px; border:1px dashed var(--border-strong); border-radius:9px;}

  /* Tabs */
  .tabs-row{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto;}
  .tab-btn{padding:10px 14px; font-size:12.5px; font-weight:700; color:var(--text-2); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab-btn:hover{color:var(--text);}

var CURRENT_USER_ID = null;

/* ---- TEMA: guarda a preferência de tema (system/light/dark) escolhida em Configurações
   para sobreviver a um F5/fechar-e-abrir o navegador — antes disso o tema voltava sempre
   para "Automático" a cada atualização de página, porque o useState não lia de lugar
   nenhum. Mesmo padrão try/catch de saveSession/loadSessionUserId acima (modo privado /
   localStorage bloqueado não deve quebrar o app, só deixa de lembrar o tema). ---- */
var THEME_KEY = "fohat_theme_v1";
function loadTheme(){
  try{
    var t = localStorage.getItem(THEME_KEY);

  }catch(err){ return "system"; }
}

}
function saveSession(userId, remember){
  try{
    var payload = JSON.stringify({userId:userId, ts:Date.now()});
    if (remember){ localStorage.setItem(SESSION_KEY, payload); sessionStorage.removeItem(SESSION_KEY); }
    else { sessionStorage.setItem(SESSION_KEY, payload); localStorage.removeItem(SESSION_KEY); }
  }catch(err){ /* localStorage indisponível (ex.: modo privado) — sessão só dura o render atual */ }
}
function loadSessionUserId(){
  try{
    var raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var data = JSON.parse(raw);
    return (data && data.userId) ? data.userId : null;
  }catch(err){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); }catch(err){}
}

/* Decide se uma reserva precisa de autorização do almoxarife antes de ser confirmada: reserva
   longa demais (>30 dias) ou a mesma pessoa já tem outra reserva/retirada em aberto da mesma
   ferramenta. Retorna "duracao"/"duplicada" (motivo) ou null (autorização automática). */
function motivoAutorizacaoReserva(usuarioId, ferramentaId, dataInicio, dataFim, ignorarReservaId, reservasAtuais, retiradasAtuais){
  var inicio = new Date(dataInicio), fim = new Date(dataFim);
  var dias = (fim.getTime() - inicio.getTime()) / (1000*60*60*24);
  if (dias > RESERVA_DURACAO_MAX_DIAS) return "duracao";
  var duplicada = (reservasAtuais||[]).some(function(r){
    return r.id !== ignorarReservaId && r.usuarioId === usuarioId && r.ferramentaId === ferramentaId
      && (r.status === "AGENDADA" || r.status === "PENDENTE_AUTORIZACAO");
  }) || (retiradasAtuais||[]).some(function(r){
    return r.usuarioId === usuarioId && r.ferramentaId === ferramentaId && !r.devolvidoEm;
  });
  if (duplicada) return "duplicada";
  return null;
}
function isRetiradaAtrasada(r){
  return !r.devolvidoEm && !!r.previsaoDevolucao && new Date(r.previsaoDevolucao) < new Date();
}

/* ============================================================================

   como fonte de verdade depois do login). As funções mapXFromDb() só traduzem
   nome_de_coluna (snake_case, como vem do Postgres) para osCamposCamelCase que
   o resto deste arquivo já espera — nenhum componente de tela precisou mudar
   por causa disso.
   ETAPA 06 — as funções xPatchToDb() fazem o caminho inverso (camelCase → banco)
   e são usadas pelas ações de escrita (criar/editar/excluir), que agora também
   gravam no Supabase de verdade, além de atualizar a tela na hora. ---- */
function mapProfileFromDb(row){
  return {
    id: row.id, nome: row.nome, cargo: row.cargo || "", iniciais: row.iniciais || initialsOf(row.nome||"?"),
    cor: row.cor || "#6d7889", email: row.email || "", telefone: row.telefone || "",
    senha: null, perfil: row.perfil, status: row.status, ultimoAcesso: row.ultimo_acesso,
    /* Ferramentaria: colunas novas em profiles (ver schema_ferramentaria.sql). Tratadas de forma
       defensiva (!== false / !!) para não quebrar a rotina de ninguém enquanto a migração ainda
       não tiver sido rodada no banco — nesse meio-tempo o Supabase simplesmente não devolve essas
       colunas, e o app se comporta como se todo mundo só tivesse acesso ao Workspace, como hoje. */
    acessoWorkspace: row.acesso_workspace !== false,
    acessoFerramentaria: !!row.acesso_ferramentaria,
    ferramentariaPerfil: row.ferramentaria_perfil || null,
    termosFerramentariaAceitos: !!row.termos_ferramentaria_aceitos,
    termosFerramentariaAceitosEm: row.termos_ferramentaria_aceitos_em || null
  };
}
function mapProjetoFromDb(row, atividadesByProjeto, profilesById){

/* Busca tudo da Ferramentaria no Supabase. Protegido só pela RLS (tem_acesso_ferramentaria()): quem
   não tem acesso simplesmente recebe listas vazias, sem erro — por isso é seguro chamar isto sempre,
   junto de fetchWorkspaceSnapshot(), mesmo para quem só usa o Workspace de Gestão de Demandas. */
function fetchFerramentariaSnapshot(){
  var sb = window.__FOHAT_SB__;
  return Promise.all([
    sb.from("ferramentaria_obras").select("*").order("nome", {ascending:true}),
    sb.from("ferramentaria_ferramentas").select("*").order("nome", {ascending:true}),
    sb.from("ferramentaria_reservas").select("*").order("data_inicio", {ascending:true}),
    sb.from("ferramentaria_retiradas").select("*").order("retirado_em", {ascending:false}),
    sb.from("ferramentaria_manutencoes").select("*").order("data_inicio", {ascending:false}),
    sb.from("ferramentaria_equipamentos").select("*").order("nome", {ascending:true}),
    sb.from("ferramentaria_equipamento_manutencoes").select("*").order("criado_em", {ascending:false})
  ]).then(function(results){
    var obrasRes=results[0], ferramentasRes=results[1], reservasRes=results[2], retiradasRes=results[3],
        manutencoesRes=results[4], equipamentosRes=results[5], equipManutRes=results[6];
    var firstError = obrasRes.error || ferramentasRes.error || reservasRes.error || retiradasRes.error
      || manutencoesRes.error || equipamentosRes.error || equipManutRes.error;
    if (firstError) throw firstError;
    return {
      obras: (obrasRes.data||[]).map(mapObraFerramentariaFromDb),
      ferramentas: (ferramentasRes.data||[]).map(mapFerramentaFromDb),
      reservas: (reservasRes.data||[]).map(mapReservaFromDb),
      retiradas: (retiradasRes.data||[]).map(mapRetiradaFromDb),
      manutencoes: (manutencoesRes.data||[]).map(mapManutencaoFromDb),
      equipamentos: (equipamentosRes.data||[]).map(mapEquipamentoFromDb),
      equipamentoManutencoes: (equipManutRes.data||[]).map(mapEquipamentoManutencaoFromDb)
    };
  });
}

/* Busca tudo de novo no Supabase e devolve {profiles, projects, demandas} já no formato que
   o app usa. Não mexe em nenhum state React — quem chama decide o que fazer com o resultado
   (por isso dá para reaproveitar tanto no carregamento inicial quanto depois do login). */
function fetchWorkspaceSnapshot(){
  var sb = window.__FOHAT_SB__;
  return Promise.all([
    sb.from("profiles").select("*"),
    sb.from("projetos").select("*").order("criado_em", {ascending:true}),
    sb.from("projeto_atividades").select("*").order("criado_em", {ascending:true}),
    sb.from("demandas").select("*").order("criado_em", {ascending:true}),
    sb.from("demanda_comentarios").select("*").order("criado_em", {ascending:true}),
    sb.from("demanda_atividades").select("*").order("criado_em", {ascending:true})
  ]).then(function(results){
    var profilesRes = results[0], projetosRes = results[1], projAtividadesRes = results[2], demandasRes = results[3],
        comentariosRes = results[4], atividadesRes = results[5];
    var firstError = profilesRes.error || projetosRes.error || projAtividadesRes.error || demandasRes.error || comentariosRes.error || atividadesRes.error;
    if (firstError) throw firstError;
    var profilesById = {};
    (profilesRes.data || []).forEach(function(row){ profilesById[row.id] = row.nome; });
    var atividadesByProjeto = {};
    (projAtividadesRes.data || []).forEach(function(row){
      var a = mapAtividadeFromDb(row);
      (atividadesByProjeto[row.projeto_id] = atividadesByProjeto[row.projeto_id] || []).push(a);
    });
    var comentariosByDemanda = {};
    (comentariosRes.data || []).forEach(function(row){
      var c = mapComentarioFromDb(row);
      (comentariosByDemanda[row.demanda_id] = comentariosByDemanda[row.demanda_id] || []).push(c);
    });
    var atividadesByDemanda = {};
    (atividadesRes.data || []).forEach(function(row){
      var a = mapAtividadeFromDb(row);
      (atividadesByDemanda[row.demanda_id] = atividadesByDemanda[row.demanda_id] || []).push(a);
    });
    return {
      profiles: (profilesRes.data || []).map(mapProfileFromDb),
      projects: (projetosRes.data || []).map(function(row){ return mapProjetoFromDb(row, atividadesByProjeto, profilesById); }),
      demandas: (demandasRes.data || []).map(function(row){ return mapDemandaFromDb(row, comentariosByDemanda, atividadesByDemanda, profilesById); })
    };
  });
}

   banco). Campos que não existem no banco (ex.: alteradoPor, driveLinkOverride) são só
   informativos na tela e ficam de fora do que é gravado — não geram erro, só não persistem. */
var DEMANDA_FIELD_TO_DB = {
  projetoId:"projeto_id", titulo:"titulo", disciplina:"disciplina", responsavelId:"responsavel_id",
  status:"status", prioridade:"prioridade", dataInicio:"data_inicio", prazo:"prazo", progresso:"progresso",
  descricao:"descricao", observacoes:"observacoes", checklist:"checklist", arquivos:"arquivos",
  pendenciaDescricao:"pendencia_descricao", dataSolicitacao:"data_solicitacao"
};
var DEMANDA_DATE_COLS = {data_inicio:true, prazo:true, data_solicitacao:true};
function demandaPatchToDb(patch){
  var out = {};
  Object.keys(patch).forEach(function(k){
    var col = DEMANDA_FIELD_TO_DB[k];
    if (!col) return;
    var v = patch[k];
    out[col] = (DEMANDA_DATE_COLS[col] && v === "") ? null : v;
  });
  out.atualizado_em = new Date().toISOString();
  return out;
}

/* Gera um uuid válido no navegador (sem depender de biblioteca) para novas linhas — assim o
   id usado na tela otimisticamente já é o mesmo id gravado no banco. */
function newDbId(){
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8); return v.toString(16);
  });
}

/* ---- ETAPA 07 — gestão real de usuários (Edge Function "admin-users") ----
   Criar, editar (inclusive e-mail/senha) e excluir outros usuários exige a Admin API do
   Supabase Auth, que só pode ser usada com a service_role key — uma chave que NUNCA pode
   ficar no navegador. Por isso essas ações passam por uma função de servidor (Edge Function)
   chamada "admin-users": o navegador manda a sessão de quem está logado, a função confere no
   próprio banco se essa pessoa é ADMINISTRADOR, e só então usa a chave privilegiada.
   callAdminUsers() é o único ponto do app que fala com essa função — sempre devolve uma
   Promise que resolve para {ok:true, ...} ou {ok:false, error:"mensagem em português"},
   nunca rejeita, para que quem chama só precise checar res.ok. */
function callAdminUsers(action, payload){
  var sb = window.__FOHAT_SB__;
  var body = Object.assign({action: action}, payload || {});
  function fallbackError(err){ return (err && err.message) || "Não foi possível completar a operação."; }
  return sb.functions.invoke("admin-users", {body: body}).then(function(res){
    if (res.error){
      var ctx = res.error.context;
      if (ctx && typeof ctx.json === "function"){
        return ctx.json().then(function(errBody){
          return {ok:false, error: (errBody && errBody.error) || fallbackError(res.error)};
        }, function(){
          return {ok:false, error: fallbackError(res.error)};
        });
      }
      return {ok:false, error: fallbackError(res.error)};
    }
    if (res.data && typeof res.data === "object") return res.data;
    return {ok:true};
  }, function(){
    return {ok:false, error:"Não foi possível conectar ao servidor. Verifique sua internet e tente novamente."};
  });
}

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function parseISO(s){ if(!s) return null; var p=s.split("T")[0].split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function todayDate(){ var d = new Date(); d.setHours(0,0,0,0); return d; }

function fmtDateShort(iso){ if(!iso) return "—"; var p = iso.split("T")[0].split("-"); return p[2]+"/"+p[1]; }
function fmtDateTimeBR(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());

function inDateRange(iso, range){
  if (!range) return true;
  var due = parseISO(iso);
  if (!due) return false;
  var today = todayDate();
  if (range === "atrasadas") return due < today;
  if (range === "semana"){ var w = new Date(today); w.setDate(w.getDate()+7); return due >= today && due <= w; }

    if (f.responsavelId && d.responsavelId !== f.responsavelId) return false;
    if (f.status && d.status !== f.status) return false;
    if (f.prioridade && d.prioridade !== f.prioridade) return false;
    if (f.disciplina && d.disciplina !== f.disciplina) return false;
    if (f.prazo && !inDateRange(d.prazo, f.prazo)) return false;

/* ============================== CALENDAR ============================== */
var MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var DOW_NAMES = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function CalendarView(props){
  var rows = props.rows;
  var app = useApp();
  var todayD = todayDate();
  var cursorState = useState({year: todayD.getFullYear(), month: todayD.getMonth()});
  var cursor = cursorState[0], setCursor = cursorState[1];
  var moreOpenState = useState(null); var moreOpenKey = moreOpenState[0], setMoreOpenKey = moreOpenState[1];

  var byDay = {};
  rows.forEach(function(d){
    if (!d.prazo) return;
    var key = d.prazo.split("T")[0];
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(d);
  });

  var first = new Date(cursor.year, cursor.month, 1);
  var startOffset = first.getDay();
  var gridStart = new Date(cursor.year, cursor.month, 1 - startOffset);
  var cells = [];
  for (var i=0;i<42;i++){
    var dt = new Date(gridStart); dt.setDate(gridStart.getDate()+i);
    cells.push(dt);
  }

  function keyOf(dt){ return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate()); }
  function go(delta){
    var m = cursor.month + delta, y = cursor.year;
    if (m<0){ m=11; y--; } if (m>11){ m=0; y++; }
    setCursor({year:y, month:m});
  }

  return e("div", null,
    e("div", {className:"cal-head"},
      e("button", {className:"iconbtn", onClick:function(){go(-1);}}, e(Icon,{name:"chevronleft"})),
      e("h2", null, MONTH_NAMES[cursor.month] + " " + cursor.year),
      e("button", {className:"iconbtn", onClick:function(){go(1);}}, e(Icon,{name:"chevronright"})),
      e("button", {className:"btn secondary sm", onClick:function(){ setCursor({year:todayD.getFullYear(), month:todayD.getMonth()}); }}, "Hoje")
    ),
    e("div", {className:"cal-grid"},
      DOW_NAMES.map(function(n){ return e("div", {key:n, className:"cal-dow"}, n); }),
      cells.map(function(dt){
        var key = keyOf(dt);
        var items = byDay[key] || [];
        var isToday = key === keyOf(todayD);
        var otherMonth = dt.getMonth() !== cursor.month;
        var visible = items.slice(0,3);
        var extra = items.length - visible.length;
        return e("div", {key:key, className:classNames("cal-cell", otherMonth && "other-month", isToday && "today")},
          e("div", {className:"cal-daynum"}, dt.getDate()),
          visible.map(function(d){
            var meta = STATUS_META[isOverdueDemanda(d) ? "ATRASADO" : d.status];
            return e("div", {key:d.id, className:"cal-chip", style:{background:meta.soft, color:meta.color},
              onClick:function(){ app.openDetail(d.id); }}, d.titulo);
          }),
          extra > 0 ? e("div", {className:"cal-more", onClick:function(){ setMoreOpenKey(moreOpenKey===key?null:key); }}, "+"+extra+" mais") : null,
          moreOpenKey===key ? items.slice(3).map(function(d){
            var meta = STATUS_META[isOverdueDemanda(d) ? "ATRASADO" : d.status];
            return e("div", {key:d.id, className:"cal-chip", style:{background:meta.soft, color:meta.color},
              onClick:function(){ app.openDetail(d.id); }}, d.titulo);
          }) : null
        );
      })
    )
  );
}

/* ============================== TIMELINE / GANTT ============================== */
function TimelineView(props){
  var rows = props.rows.filter(function(d){ return d.dataInicio && d.prazo; });
  var app = useApp();
  if (!rows.length) return e(EmptyState, {icon:"clock", text:"Sem datas suficientes para montar a timeline."});

  var minTime = Math.min.apply(null, rows.map(function(d){ return parseISO(d.dataInicio).getTime(); }));
  var maxTime = Math.max.apply(null, rows.map(function(d){ return parseISO(d.prazo).getTime(); }));
  var span = Math.max(1, maxTime - minTime);
  var midTime = minTime + span/2;

  function fmtAxis(t){ var d = new Date(t); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1); }

  return e("div", {className:"tl-wrap"},
    e("div", {className:"tl-inner"},
      e("div", {className:"tl-axis"}, e("span",null,fmtAxis(minTime)), e("span",null,fmtAxis(midTime)), e("span",null,fmtAxis(maxTime))),
      rows.map(function(d){
        var start = parseISO(d.dataInicio).getTime(), end = parseISO(d.prazo).getTime();
        var left = ((start-minTime)/span)*100;
        var width = Math.max(2, ((end-start)/span)*100);
        var meta = STATUS_META[isOverdueDemanda(d) ? "ATRASADO" : d.status];
        return e("div", {key:d.id, className:"tl-row"},
          e("div", {className:"tl-label", title:d.titulo}, d.titulo),
          e("div", {className:"tl-track"},
            e("div", {className:"tl-bar", style:{left:left+"%", width:width+"%", background:meta.soft, cursor:"pointer"},
                onClick:function(){ app.openDetail(d.id); }, title:d.titulo+" · "+meta.label},
              e("div", {className:"fill", style:{width:d.progresso+"%", background:meta.color}})
            )
          ),
          e(Avatar, {user:findUser(d.responsavelId), size:20}),
          e("span", {className:"num", style:{fontSize:11, color:"var(--text-3)", width:32, textAlign:"right"}}, d.progresso+"%")
        );
      }),
      e("div", {className:"tl-legend"},
        STATUS_ORDER.map(function(s){
          return e("span", {key:s}, e("i",{style:{background:STATUS_META[s].color}}), STATUS_META[s].label);
        })
      )
    )
  );
}

  var filterState = useState(DEFAULT_PROJECT_FILTERS); var filters = filterState[0], setFilters = filterState[1];

  var tipos = useMemo(function(){ return Array.from(new Set(app.projects.map(function(p){return p.tipo;}))).sort(); }, [app.projects]);

  var visiveis = useMemo(function(){
    var q = search.toLowerCase().trim();
    var list = app.projects.filter(function(p){
      var comp = app.projectComputed[p.id] || {};
      if (filters.status && comp.status !== filters.status) return false;
      if (filters.responsavelId && p.responsavelId !== filters.responsavelId) return false;
      if (filters.cliente && p.cliente !== filters.cliente) return false;
      if (filters.tipo && p.tipo !== filters.tipo) return false;
      if (q){
        var resp = findUser(p.responsavelId);
        var hay = (p.nome + " " + p.cliente + " " + (resp?resp.nome:"") + " " + p.tipo + " " + (STATUS_META[comp.status]?STATUS_META[comp.status].label:"")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;

      return true;

    withKey.sort(function(a,b){
      if (sortBy==="nome_asc") return a.p.nome.localeCompare(b.p.nome);
      if (sortBy==="nome_desc") return b.p.nome.localeCompare(a.p.nome);
      if (sortBy==="prazo_asc") return a.prazoKey.localeCompare(b.prazoKey);
      if (sortBy==="prazo_desc") return b.prazoKey.localeCompare(a.prazoKey);

function computeProjectStatus(ds){
  if (!ds.length) return "NAO_INICIADO";
  if (ds.every(function(d){ return d.status==="CONCLUIDO"; })) return "CONCLUIDO";
  if (ds.some(function(d){ return d.status==="BLOQUEADO"; })) return "BLOQUEADO";
  if (ds.some(isOverdueDemanda)) return "ATRASADO";
  if (ds.some(function(d){ return d.status==="EM_REVISAO"; })) return "EM_REVISAO";
  if (ds.some(function(d){ return d.status==="AGUARDANDO_CLIENTE"||d.status==="AGUARDANDO_TERCEIRO"; })) return "AGUARDANDO_CLIENTE";
  return "EM_ANDAMENTO";
}

        e("button", {type:"submit", className:"login-submit", disabled:loading},
          loading ? e(React.Fragment, null, e("span",{className:"login-spinner"}), "ENTRANDO...") : "ENTRAR"
        ),
        e("div", {className:"login-footer"}, "© 2026 ", e("b",{className:"login-footer-brand"},"FOHAT"), " Engenharia e Instalações. Todos os direitos reservados.")
      )
    ),
    forgotOpen ? e(Modal, {title:"Esqueci minha senha", onClose:function(){ setForgotOpen(false); },
        footer: e("button", {className:"btn secondary", onClick:function(){ setForgotOpen(false); }}, "Entendi")},
      e("p", {style:{color:"var(--text-2)"}}, "Este é um protótipo: não há um serviço de e-mail conectado para redefinir senhas automaticamente."),
      e("p", {style:{color:"var(--text-2)"}}, "Em produção, esta ação enviaria um link de redefinição para o seu e-mail corporativo. Por enquanto, solicite ao administrador do sistema (Jhonatan Reis) que redefina sua senha em Configurações → Usuários.")
    ) : null
  );
}

function App(){
  var projState = useState([]); var projects = projState[0], setProjects = projState[1];
  var demState = useState([]); var demandas = demState[0], setDemandas = demState[1];
  var routeState = useState({page:"inicio"}); var route = routeState[0], setRoute = routeState[1];
  var modalState = useState(null); var modal = modalState[0], setModal = modalState[1];
  var detailIdState = useState(null); var detailId = detailIdState[0], setDetailId = detailIdState[1];
  var collapsedState = useState(false); var sidebarCollapsed = collapsedState[0], setSidebarCollapsed = collapsedState[1];
  var mobileNavState = useState(false); var mobileNavOpen = mobileNavState[0], setMobileNavOpen = mobileNavState[1];
  var themeState = useState(loadTheme); var theme = themeState[0], setThemeState = themeState[1];

  /* ---- FERRAMENTARIA — mesmo padrão de projects/demandas acima, "gavetas" próprias.
     workspace começa null; só é definido depois que os dados da sessão carregam (ver
     refreshWorkspaceData/login abaixo), quando dá pra decidir via resolveInitialWorkspace(). */
  var workspaceState = useState(null); var workspace = workspaceState[0], setWorkspace = workspaceState[1];
  var obrasState = useState([]); var obras = obrasState[0], setObras = obrasState[1];
  var ferramentasState = useState([]); var ferramentas = ferramentasState[0], setFerramentas = ferramentasState[1];
  var reservasState = useState([]); var reservas = reservasState[0], setReservas = reservasState[1];
  var retiradasState = useState([]); var retiradas = retiradasState[0], setRetiradas = retiradasState[1];
  var manutencoesState = useState([]); var manutencoes = manutencoesState[0], setManutencoes = manutencoesState[1];
  var equipamentosState = useState([]); var equipamentos = equipamentosState[0], setEquipamentos = equipamentosState[1];
  var equipManutState = useState([]); var equipamentoManutencoes = equipManutState[0], setEquipamentoManutencoes = equipManutState[1];

  /* ---- SESSÃO / LOGIN (Etapa 05 — Supabase Auth de verdade) ----
     sessionUserId continua sendo o único "state" React da autenticação (mesmo padrão de
     "global mutável + rerender pela raiz" já usado neste arquivo para CURRENT_USER_ID), só que
     agora quem manda na sessão é o próprio Supabase (supabase.auth), não mais localStorage
     próprio. authReady só fica true depois que a gente já checou se existe uma sessão salva
     pelo Supabase — enquanto isso, mostramos uma tela de carregamento em vez de "piscar" a
     tela de login por engano. usersVersion continua existindo pelo mesmo motivo de antes:
     USERS é substituído/mutado fora do ciclo normal do React (agora pelos dados vindos do
     banco), e incrementar usersVersion é o que faz o React perceber e re-renderizar. */
  var sessionState = useState(null); var sessionUserId = sessionState[0], setSessionUserId = sessionState[1];
  var authReadyState = useState(false); var authReady = authReadyState[0], setAuthReady = authReadyState[1];
  var dataErrorState = useState(""); var dataError = dataErrorState[0], setDataError = dataErrorState[1];
  var usersVersionState = useState(0); var usersVersion = usersVersionState[0], setUsersVersion = usersVersionState[1];
  function bumpUsers(){ setUsersVersion(function(v){ return v+1; }); }
  CURRENT_USER_ID = sessionUserId;
  var currentUser = findUser(CURRENT_USER_ID);

  /* ---- ETAPA 06 — aviso de sincronização ----
     As ações de escrita atualizam a tela na hora (otimista) e gravam no Supabase em paralelo.
     Se a gravação real falhar (sem internet, RLS recusou etc.), a tela já mudou mas o banco
     não — em vez de falhar silenciosamente, mostramos este aviso no topo. */
  var syncErrorState = useState(""); var syncError = syncErrorState[0], setSyncError = syncErrorState[1];
  var syncErrorTimerRef = useRef(null);
  function reportSyncError(msg){
    setSyncError(msg);
    if (syncErrorTimerRef.current) window.clearTimeout(syncErrorTimerRef.current);
    syncErrorTimerRef.current = window.setTimeout(function(){ setSyncError(""); }, 8000);
  }

  /* Recarrega perfis/projetos/demandas do Supabase e aplica no state do React. Usada tanto
     no carregamento inicial (se já havia uma sessão salva) quanto logo após um login novo. */
  /* Carrega Gestão de Demandas + Ferramentaria em paralelo. A Ferramentaria é protegida só pela
     RLS (tem_acesso_ferramentaria()) — quem não tem acesso recebe listas vazias, sem erro — então
     é seguro buscar sempre, mesmo para quem só usa o Workspace. */
  function refreshWorkspaceData(){
    return fetchWorkspaceSnapshot().then(function(snap){
      USERS = snap.profiles;
      setProjects(snap.projects);
      setDemandas(snap.demandas);
      setDataError("");
      bumpUsers();
      /* Ferramentaria busca à parte, e um erro aqui NUNCA derruba a Gestão de Demandas — por
         exemplo, antes de rodar schema_ferramentaria.sql no banco, essas tabelas ainda não
         existem, e mesmo assim o Workspace precisa continuar funcionando normalmente. */
      return fetchFerramentariaSnapshot().then(function(ferrSnap){
        setObras(ferrSnap.obras);
        setFerramentas(ferrSnap.ferramentas);
        setReservas(ferrSnap.reservas);
        setRetiradas(ferrSnap.retiradas);
        setManutencoes(ferrSnap.manutencoes);
        setEquipamentos(ferrSnap.equipamentos);
        setEquipamentoManutencoes(ferrSnap.equipamentoManutencoes);
      }, function(){ /* Ferramentaria ainda não migrada nesse banco, ou usuário sem acesso — segue sem ela. */ });
    });
  }

  useEffect(function(){
    var sb = window.__FOHAT_SB__;
    var mounted = true;
    sb.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if (!session || !session.user){ if (mounted) setAuthReady(true); return; }
      refreshWorkspaceData().then(function(){
        if (mounted){
          var u = findUser(session.user.id);
          setWorkspace(resolveInitialWorkspace(u));
          setSessionUserId(session.user.id);
          setAuthReady(true);
        }
      }, function(){
        if (mounted){ setDataError("Não foi possível carregar os dados do servidor. Verifique sua conexão e recarregue a página."); setAuthReady(true); }
      });
    });
    var subscription = sb.auth.onAuthStateChange(function(event){
      if (event === "SIGNED_OUT" && mounted) setSessionUserId(null);
    });
    return function(){
      mounted = false;
      if (subscription && subscription.data && subscription.data.subscription) subscription.data.subscription.unsubscribe();
    };
  }, []);

  function login(email, senha, remember){
    var sb = window.__FOHAT_SB__;
    return sb.auth.signInWithPassword({email: email, password: senha}).then(function(res){
      if (res.error) return {ok:false, error:"E-mail ou senha inválidos."};
      return refreshWorkspaceData().then(function(){
        var u = findUser(res.data.user.id);
        if (!u) { sb.auth.signOut(); return {ok:false, error:"Seu usuário ainda não tem um perfil configurado no sistema. Contate o administrador."}; }
        if (u.status !== "ativo"){ sb.auth.signOut(); return {ok:false, error:"Este usuário está inativo. Contate o administrador do sistema."}; }
        if (!u.acessoWorkspace && !u.acessoFerramentaria){ sb.auth.signOut(); return {ok:false, error:"Este usuário não tem acesso a nenhum workspace. Contate o administrador do sistema."}; }
        setSessionUserId(u.id);
        setWorkspace(resolveInitialWorkspace(u));
        return {ok:true};
      }, function(){
        return {ok:false, error:"Login feito, mas não foi possível carregar os dados do servidor. Tente novamente."};
      });
    }, function(){
      return {ok:false, error:"Não foi possível conectar ao servidor. Verifique sua internet e tente novamente."};
    });
  }
  function logout(){
    window.__FOHAT_SB__.auth.signOut();
    setSessionUserId(null);
    setRoute({page:"inicio"});
    setDetailId(null);
    setModal(null);
    setWorkspace(null);
  }
  /* Só faz sentido para quem tem acesso aos dois workspaces — o item de menu que chama isso já
     fica oculto para os demais; o guard aqui evita um estado inválido se for chamado por outro
     caminho no futuro. */
  function switchWorkspace(){
    var u = findUser(CURRENT_USER_ID);
    if (!u || !u.acessoWorkspace || !u.acessoFerramentaria) return;
    setWorkspace(null);
    setRoute({page:"inicio"});
    setDetailId(null);
    setModal(null);
  }
  function selectWorkspace(name){
    setWorkspace(name);
    setRoute({page: name==="ferramentaria" ? "ferr_dashboard" : "inicio"});
  }
  /* Termo de uso da Ferramentaria: aceite do próprio usuário (mesmo padrão de updateProprioPerfil
     — a política de RLS "profiles_update_self" já libera essas duas colunas para autoedição). */
  function aceitarTermosFerramentaria(){
    var u = findUser(CURRENT_USER_ID);
    if (!u) return Promise.resolve({ok:false, error:"Sessão inválida."});
    var agora = new Date().toISOString();
    return window.__FOHAT_SB__.from("profiles").update({termos_ferramentaria_aceitos:true, termos_ferramentaria_aceitos_em: agora}).eq("id", u.id).select().then(function(res){
      if (res.error || !res.data || !res.data.length) return {ok:false, error:"Não foi possível registrar o aceite. Tente novamente."};
      return refreshWorkspaceData().then(function(){ return {ok:true}; }, function(){ return {ok:true}; });
    }, function(){
      return {ok:false, error:"Não foi possível conectar ao servidor."};
    });
  }

  /* ---- ETAPA 07 — as quatro funções abaixo agora gravam de verdade, via a Edge Function
     admin-users (criar/editar/excluir conta de outra pessoa exige a Admin API do Supabase,
     que só existe no servidor). Todas devolvem uma Promise {ok, error?} — os formulários e
     modais que as chamam (UsuarioFormModal, ToggleStatusModal, DeleteUsuarioModal) tratam o
     resultado de forma assíncrona, com um estado de "salvando..." enquanto isso. Depois de
     qualquer mudança bem-sucedida, refreshWorkspaceData() busca a lista atualizada no banco —
     mais simples e mais correto do que tentar adivinhar localmente o que o servidor gravou. */
  function addUsuario(form){
    if (!can("gerenciar_usuarios")) return Promise.resolve({ok:false, error:"Sem permissão."});
    if (findUserByEmail(form.email)) return Promise.resolve({ok:false, error:"Já existe um usuário com este e-mail."});
    if (!form.acessoWorkspace && !form.acessoFerramentaria) return Promise.resolve({ok:false, error:"Marque ao menos um acesso: Workspace e/ou Ferramentaria."});
    return callAdminUsers("create", {
      nome: form.nome, email: form.email, cargo: form.cargo, telefone: form.telefone,
      senha: form.senha, perfil: form.perfil, status: form.status,
      acessoWorkspace: !!form.acessoWorkspace, acessoFerramentaria: !!form.acessoFerramentaria,
      ferramentariaPerfil: form.acessoFerramentaria ? (form.ferramentariaPerfil || "COLABORADOR") : null
    }).then(function(res){
      if (!res.ok) return res;
      refreshWorkspaceData();
      return {ok:true};
    });
  }
  function updateUsuario(id, patch){
    if (!can("gerenciar_usuarios")) return Promise.resolve({ok:false, error:"Sem permissão."});
    if (patch.email && findUserByEmail(patch.email) && findUserByEmail(patch.email).id !== id) {
      return Promise.resolve({ok:false, error:"Já existe um usuário com este e-mail."});
    }
    if (typeof patch.acessoWorkspace !== "undefined" || typeof patch.acessoFerramentaria !== "undefined"){
      var alvo = findUser(id);
      var aw = typeof patch.acessoWorkspace !== "undefined" ? !!patch.acessoWorkspace : (alvo && alvo.acessoWorkspace);
      var af = typeof patch.acessoFerramentaria !== "undefined" ? !!patch.acessoFerramentaria : (alvo && alvo.acessoFerramentaria);
      if (!aw && !af) return Promise.resolve({ok:false, error:"Marque ao menos um acesso: Workspace e/ou Ferramentaria."});
      patch = Object.assign({}, patch, {acessoWorkspace: aw, acessoFerramentaria: af, ferramentariaPerfil: af ? (patch.ferramentariaPerfil || (alvo && alvo.ferramentariaPerfil) || "COLABORADOR") : null});
    }
    return callAdminUsers("update", {id: id, patch: patch}).then(function(res){
      if (!res.ok) return res;
      refreshWorkspaceData();
      return {ok:true};
    });
  }
  /* Editar o próprio nome/telefone/senha NÃO precisa da Edge Function: a política de RLS já
     permite que qualquer usuário atualize a própria linha em profiles, e trocar a própria
     senha é uma operação normal do Supabase Auth (sb.auth.updateUser) — nenhuma das duas
     mexe em auth.users de outra pessoa, então a service_role key não entra aqui. */
  function updateProprioPerfil(patch){
    var u = findUser(CURRENT_USER_ID);
    if (!u) return Promise.resolve({ok:false, error:"Sessão inválida."});
    var sb = window.__FOHAT_SB__;
    var profilePatch = {};
    if (typeof patch.nome === "string" && patch.nome.trim()) profilePatch.nome = patch.nome.trim();
    if (typeof patch.telefone === "string") profilePatch.telefone = patch.telefone;
    var tasks = [];
    if (Object.keys(profilePatch).length) tasks.push(sb.from("profiles").update(profilePatch).eq("id", u.id).select());
    if (typeof patch.senha === "string" && patch.senha) tasks.push(sb.auth.updateUser({password: patch.senha}));
    if (!tasks.length) return Promise.resolve({ok:true});
    return Promise.all(tasks).then(function(results){
      for (var i=0;i<results.length;i++){
        if (results[i] && results[i].error) return {ok:false, error: results[i].error.message || "Não foi possível salvar as alterações."};
      }
      return refreshWorkspaceData().then(function(){ return {ok:true}; }, function(){ return {ok:true}; });
    }, function(){
      return {ok:false, error:"Não foi possível conectar ao servidor."};
    });
  }
  function toggleUsuarioStatus(id){
    if (!can("gerenciar_usuarios")) return Promise.resolve({ok:false, error:"Sem permissão."});
    if (id === CURRENT_USER_ID) return Promise.resolve({ok:false, error:"Você não pode alterar seu próprio status."});
    var u = findUser(id);
    if (!u) return Promise.resolve({ok:false, error:"Usuário não encontrado."});
    return updateUsuario(id, {status: u.status==="ativo" ? "inativo" : "ativo"});
  }
  function excluirUsuario(id){
    if (!can("gerenciar_usuarios")) return Promise.resolve({ok:false, error:"Sem permissão."});
    if (id === CURRENT_USER_ID) return Promise.resolve({ok:false, error:"Você não pode excluir seu próprio usuário."});
    return callAdminUsers("delete", {id: id}).then(function(res){
      if (!res.ok) return res;
      refreshWorkspaceData();
      return {ok:true};
    });
  }

  /* ============================== FERRAMENTARIA — ações ==============================
     Mesmo padrão já usado para projetos/demandas acima: atualiza a tela na hora (otimista) e
     grava no Supabase em paralelo; se a gravação falhar, reportSyncError avisa no topo. */
  function addObraFerramentaria(nome){
    nome = (nome||"").trim();
    if (!hasFerramentariaAccess()) return Promise.resolve(null);
    if (!nome) return Promise.resolve(null);
    var existente = obras.filter(function(o){ return o.nome.toLowerCase()===nome.toLowerCase(); })[0];
    if (existente) return Promise.resolve(existente);
    var novaId = newDbId();
    var nova = {id: novaId, nome: nome};
    setObras(function(prev){ return prev.concat([nova]); });
    return window.__FOHAT_SB__.from("ferramentaria_obras").insert({id: novaId, nome: nome}).select().then(function(res){
      if (res.error || !res.data || !res.data.length){ reportSyncError("A obra apareceu na tela, mas não foi salva no servidor."); return nova; }
      return nova;
    });
  }

  function addFerramenta(form){
    if (!canGerenciarCatalogoFerramentas()) return Promise.resolve({ok:false, error:"Sem permissão."});
    var novoId = newDbId();
    var novo = {
      id: novoId, nome: form.nome, categoria: form.categoria, marca: form.marca||"", modelo: form.modelo||"",
      numeroPatrimonio: form.numeroPatrimonio||"", valorAquisicao: form.valorAquisicao||null, dataAquisicao: form.dataAquisicao||null,
      status: "DISPONIVEL", precisaCalibragem: !!form.precisaCalibragem, observacoes: form.observacoes||""
    };
    setFerramentas(function(prev){ return prev.concat([novo]); });
    return window.__FOHAT_SB__.from("ferramentaria_ferramentas").insert({
      id: novoId, nome: novo.nome, categoria: novo.categoria, marca: novo.marca||null, modelo: novo.modelo||null,
      numero_patrimonio: novo.numeroPatrimonio||null, valor_aquisicao: novo.valorAquisicao, data_aquisicao: novo.dataAquisicao||null,
      status: "DISPONIVEL", precisa_calibragem: novo.precisaCalibragem, observacoes: novo.observacoes||null
    }).select().then(function(res){
      if (res.error || !res.data || !res.data.length){ reportSyncError("A ferramenta apareceu na tela, mas não foi salva no servidor."); return {ok:false, error:"Não foi possível salvar no servidor."}; }
      return {ok:true};
    });
  }
  function updateFerramenta(id, patch){
    if (!canGerenciarCatalogoFerramentas()) return Promise.resolve({ok:false, error:"Sem permissão."});
    setFerramentas(function(prev){ return prev.map(function(f){ return f.id===id ? Object.assign({}, f, patch) : f; }); });
    var dbPatch = {};
    var map = {nome:"nome", categoria:"categoria", marca:"marca", modelo:"modelo", numeroPatrimonio:"numero_patrimonio",
      valorAquisicao:"valor_aquisicao", dataAquisicao:"data_aquisicao", status:"status", precisaCalibragem:"precisa_calibragem", observacoes:"observacoes"};
    Object.keys(patch).forEach(function(k){ if (map[k]) dbPatch[map[k]] = patch[k]; });
    dbPatch.atualizado_em = new Date().toISOString();
    return window.__FOHAT_SB__.from("ferramentaria_ferramentas").update(dbPatch).eq("id", id).select().then(function(res){
      if (res.error || !res.data || !res.data.length){ reportSyncError("Não foi possível salvar essa alteração da ferramenta no servidor."); return {ok:false}; }
      return {ok:true};
    });
  }
  function excluirFerramenta(id){
    if (!canGerenciarCatalogoFerramentas()) return Promise.resolve({ok:false, error:"Sem permissão."});
    setFerramentas(function(prev){ return prev.filter(function(f){ return f.id!==id; }); });
    return window.__FOHAT_SB__.from("ferramentaria_ferramentas").delete().eq("id", id).select().then(function(res){
      if (res.error || !res.data || !res.data.length){ reportSyncError("A ferramenta foi removida da tela, mas não pôde ser excluída no servidor — ela pode voltar a aparecer se a página for recarregada."); return {ok:false}; }
      return {ok:true};
    });
  }

  function retirarFerramenta(form){
    if (!canRetirarFerramenta()) return Promise.resolve({ok:false, error:"Sem permissão."});
    var ferramenta = ferramentas.filter(function(f){ return f.id===form.ferramentaId; })[0];
    if (!ferramenta) return Promise.resolve({ok:false, error:"Ferramenta não encontrada."});
    if (ferramenta.status !== "DISPONIVEL") return Promise.resolve({ok:false, error:"Esta ferramenta não está disponível para retirada."});
    var novoId = newDbId();
    var agora = new Date().toISOString();
    var nova = {
      id: novoId, ferramentaId: form.ferramentaId, usuarioId: form.usuarioId || CURRENT_USER_ID, obraId: form.obraId || null,
      reservaId: form.reservaId || null, retiradoEm: agora, previsaoDevolucao: form.previsaoDevolucao || null,
      devolvidoEm: null, estadoDevolucao: null, observacoes: form.observacoes || ""
    };
    setRetiradas(function(prev){ return [nova].concat(prev); });
    setFerramentas(function(prev){ return prev.map(function(f){ return f.id===form.ferramentaId ? Object.assign({}, f, {status:"EM_USO"}) : f; }); });
    var sb = window.__FOHAT_SB__;
    var tasks = [
      sb.from("ferramentaria_retiradas").insert({
        id: novoId, ferramenta_id: nova.ferramentaId, usuario_id: nova.usuarioId, obra_id: nova.obraId,
        reserva_id: nova.reservaId, retirado_em: agora, previsao_devolucao: nova.previsaoDevolucao, observacoes: nova.observacoes || null
      }).select(),
      sb.from("ferramentaria_ferramentas").update({status:"EM_USO", atualizado_em: agora}).eq("id", form.ferramentaId).select()
    ];
    if (form.reservaId){
      tasks.push(sb.from("ferramentaria_reservas").update({status:"CONVERTIDA"}).eq("id", form.reservaId).select());
      setReservas(function(prev){ return prev.map(function(r){ return r.id===form.reservaId ? Object.assign({}, r, {status:"CONVERTIDA"}) : r; }); });
    }
    return Promise.all(tasks).then(function(results){
      if (results.some(function(r){ return r.error || !r.data || !r.data.length; })){
        reportSyncError("A retirada apareceu na tela, mas houve um problema ao salvar no servidor.");
        return {ok:false};
      }
      return {ok:true};
    });
  }
  function devolverFerramenta(retiradaId, opts){
    opts = opts || {};
    if (!hasFerramentariaAccess()) return Promise.resolve({ok:false, error:"Sem permissão."});
    var retirada = retiradas.filter(function(r){ return r.id===retiradaId; })[0];
    if (!retirada || retirada.devolvidoEm) return Promise.resolve({ok:false, error:"Retirada não encontrada ou já devolvida."});
    if (!isAlmoxAdmin() && retirada.usuarioId !== CURRENT_USER_ID) return Promise.resolve({ok:false, error:"Sem permissão para devolver esta ferramenta."});
    var agora = new Date().toISOString();
    var estado = opts.estadoDevolucao || "OK";
    var novoStatusFerramenta = (estado==="DANIFICADA") ? "MANUTENCAO" : (estado==="PERDIDA") ? "EXTRAVIADA" : "DISPONIVEL";
    setRetiradas(function(prev){ return prev.map(function(r){ return r.id===retiradaId ? Object.assign({}, r, {devolvidoEm:agora, estadoDevolucao:estado, observacoes: opts.observacoes || r.observacoes}) : r; }); });
    setFerramentas(function(prev){ return prev.map(function(f){ return f.id===retirada.ferramentaId ? Object.assign({}, f, {status:novoStatusFerramenta}) : f; }); });
    var sb = window.__FOHAT_SB__;
    return Promise.all([
      sb.from("ferramentaria_retiradas").update({devolvido_em:agora, estado_devolucao:estado, observacoes: opts.observacoes || retirada.observacoes || null}).eq("id", retiradaId).select(),
      sb.from("ferramentaria_ferramentas").update({status:novoStatusFerramenta, atualizado_em: agora}).eq("id", retirada.ferramentaId).select()
    ]).then(function(results){
      if (results.some(function(r){ return r.error || !r.data || !r.data.length; })){
        reportSyncError("A devolução apareceu na tela, mas houve um problema ao salvar no servidor.");
        return {ok:false};
      }

  /* ---- ETAPA 06 — cada ação abaixo segue o mesmo padrão: aplica a mudança na tela IMEDIATAMENTE
     (otimista, exatamente como já funcionava) e, em paralelo, grava a mesma mudança no Supabase.
     Se a gravação real falhar (RLS recusou, sem internet), a tela já mudou mas o banco não —
     reportSyncError() avisa em vez de deixar isso passar em silêncio. Os ids de linhas novas são
     gerados no navegador (newDbId()) para que o id otimista já seja o mesmo id salvo no banco. */
  function pushActivity(dm, texto, collector){
    var entry = {id: newDbId(), texto: findUser(CURRENT_USER_ID).nome + " " + texto, data: new Date().toISOString()};
    if (collector) collector.push(entry);
    return dm.atividades.concat([entry]);
  }

  function updateDemanda(id, patch){
    var atual = null;
    for (var i=0;i<demandas.length;i++){ if (demandas[i].id===id){ atual = demandas[i]; break; } }
    if (!atual || !canEditDemanda(atual)) return;
    var novasAtividades = [];
    var acts = atual.atividades;
    if (patch.status && patch.status !== atual.status) acts = pushActivity(atual, "alterou o status para " + STATUS_META[patch.status].label + ".", novasAtividades);
    if (patch.prioridade && patch.prioridade !== atual.prioridade) acts = pushActivity(Object.assign({},atual,{atividades:acts}), "alterou a prioridade para " + PRIORITY_META[patch.prioridade].label + ".", novasAtividades);
    if (patch.responsavelId && patch.responsavelId !== atual.responsavelId) acts = pushActivity(Object.assign({},atual,{atividades:acts}), "reatribuiu a demanda para " + findUser(patch.responsavelId).nome + ".", novasAtividades);
    if (patch.prazo && patch.prazo !== atual.prazo) acts = pushActivity(Object.assign({},atual,{atividades:acts}), "alterou o prazo para " + fmtDateBR(patch.prazo) + ".", novasAtividades);
    if (typeof patch.progresso === "number" && patch.progresso !== atual.progresso) acts = pushActivity(Object.assign({},atual,{atividades:acts}), "atualizou o progresso para " + patch.progresso + "%.", novasAtividades);
    var autorNome = findUser(CURRENT_USER_ID).nome;
    var agora = new Date().toISOString();
    setDemandas(function(prev){
      return prev.map(function(d){
        if (d.id !== id) return d;
        var next = Object.assign({}, d, patch);
        next.atividades = acts;
        next.atualizadoEm = agora;
        next.alteradoPor = autorNome;
        return next;
      });
    });
    var sb = window.__FOHAT_SB__;
    sb.from("demandas").update(demandaPatchToDb(patch)).eq("id", id).select().then(function(res){
      if (res.error || !res.data || !res.data.length){
        reportSyncError("Não foi possível salvar essa alteração no servidor. Verifique sua internet ou suas permissões.");
        return;
      }
      if (novasAtividades.length){
        sb.from("demanda_atividades").insert(novasAtividades.map(function(a){
          return {id:a.id, demanda_id:id, autor_id:CURRENT_USER_ID, texto:a.texto};
        })).then(function(actRes){
          if (actRes.error) reportSyncError("A alteração foi salva, mas o histórico de atividade não pôde ser registrado.");
        });
      }
    });
  }

  function updateProjeto(id, patch, opts){
    opts = opts || {};
    if (!isAdmin() && !verifyAuthPassword(opts.password)) return {ok:false, error:"Autorização inválida. Confirme como administrador ou informe a senha de autorização correta."};
    var atual = null;
    for (var i=0;i<projects.length;i++){ if (projects[i].id===id){ atual = projects[i]; break; } }
    if (!atual) return {ok:false, error:"Projeto não encontrado."};
    var autor = findUser(CURRENT_USER_ID);
    var agora = new Date().toISOString();
    var mudancas = [];
    Object.keys(patch).forEach(function(k){
      var antes = atual[k] == null ? "" : String(atual[k]);
      var depois = patch[k] == null ? "" : String(patch[k]);
      if (antes !== depois){
        var label = PROJETO_CAMPOS_LABEL[k] || k;
        var antesFmt = (k==="responsavelId") ? (findUser(atual[k]) ? findUser(atual[k]).nome : "—") : (antes || "—");
        var depoisFmt = (k==="responsavelId") ? (findUser(patch[k]) ? findUser(patch[k]).nome : "—") : (depois || "—");
        mudancas.push({campo:label, antes:antesFmt, depois:depoisFmt});
      }
    });
    var novaAtividade = null;
    if (mudancas.length){
      var resumo = mudancas.length===1
        ? ("alterou o " + mudancas[0].campo + " do projeto: " + mudancas[0].antes + " → " + mudancas[0].depois + ".")
        : ("alterou " + mudancas.length + " campos do projeto (" + mudancas.map(function(m){return m.campo;}).join(", ") + ").");
      novaAtividade = {id:newDbId(), texto: autor.nome + " " + resumo, data: agora};
    }
    setProjects(function(prev){
      return prev.map(function(p){
        if (p.id !== id) return p;
        var next = Object.assign({}, p, patch);
        if (novaAtividade) next.atividades = (p.atividades||[]).concat([novaAtividade]);
        return next;
      });
    });
    var sb = window.__FOHAT_SB__;
    sb.from("projetos").update(projetoPatchToDb(patch)).eq("id", id).select().then(function(res){
      if (res.error || !res.data || !res.data.length){
        reportSyncError("Não foi possível salvar essa alteração do projeto no servidor.");
        return;
      }
      if (novaAtividade){
        sb.from("projeto_atividades").insert({id:novaAtividade.id, projeto_id:id, autor_id:autor.id, texto:novaAtividade.texto}).then(function(actRes){
          if (actRes.error) reportSyncError("A alteração foi salva, mas o histórico não pôde ser registrado.");
        });
      }
    });
    return {ok:true};
  }

    openNewDemanda: openNewDemanda, openNewProjeto: openNewProjeto, updateDemanda: updateDemanda, addDemanda: addDemanda, addProjeto: addProjeto,
    updateProjeto: updateProjeto, deleteProjeto: deleteProjeto, deleteDemanda: deleteDemanda, setAuthPassword: setAuthPassword,
    addComentario: addComentario, addArquivo: addArquivo, setModal: setModal,
    setSidebarCollapsed: setSidebarCollapsed, setMobileNavOpen: setMobileNavOpen, setTheme: setThemeState,
    currentUser: currentUser, session: {userId: CURRENT_USER_ID}, usersVersion: usersVersion, isAdmin: isAdmin(),
    can: can, canEditDemanda: canEditDemanda, canEditProject: canEditProject, canDeleteProject: canDeleteProject,
    canDeleteDemand: canDeleteDemand, canComment: canComment, verifyAuthPassword: verifyAuthPassword, logout: logout,
    addUsuario: addUsuario, updateUsuario: updateUsuario, updateProprioPerfil: updateProprioPerfil,
    toggleUsuarioStatus: toggleUsuarioStatus, excluirUsuario: excluirUsuario,
    workspace: workspace, setWorkspace: selectWorkspace, switchWorkspace: switchWorkspace,
    aceitarTermosFerramentaria: aceitarTermosFerramentaria,
    obras: obras, ferramentas: ferramentas, reservas: reservas, retiradas: retiradas,
    manutencoes: manutencoes, equipamentos: equipamentos, equipamentoManutencoes: equipamentoManutencoes,
    ferramentasById: ferramentasById, equipamentosById: equipamentosById, obrasFerramentariaById: obrasFerramentariaById,
    retiradaAtivaPorFerramenta: retiradaAtivaPorFerramenta, ferramentariaStats: ferramentariaStats,
    addObraFerramentaria: addObraFerramentaria, addFerramenta: addFerramenta, updateFerramenta: updateFerramenta, excluirFerramenta: excluirFerramenta,
    retirarFerramenta: retirarFerramenta, devolverFerramenta: devolverFerramenta, reservarFerramenta: reservarFerramenta,
    cancelarReserva: cancelarReserva, decidirAutorizacaoReserva: decidirAutorizacaoReserva
  };

  if (!authReady){
    return e("div", {className:"login-screen"},
      e("div", {className:"login-bg", style:{backgroundImage:"url(" + window.__FOHAT_LOGIN_BG__ + ")"}}),
      e("div", {className:"login-content"},
        e("div", {className:"login-panel", style:{display:"flex", alignItems:"center", justifyContent:"center", minHeight:220}},
          e("span", {className:"login-spinner", style:{borderColor:"rgba(31,111,92,.25)", borderTopColor:"#1f6f5c"}})
        )
      )
    );
  }
  if (!currentUser){
    return e(LoginScreen, {onLogin: login, loadError: dataError});
  }

  if (!workspace){
    return e(WorkspaceSelectorScreen, {app:{currentUser:currentUser, setWorkspace:selectWorkspace, logout:logout}});
  }

  if (workspace==="ferramentaria" && currentUser.acessoFerramentaria && !currentUser.termosFerramentariaAceitos){
    return e(TermosFerramentariaScreen, {app:{currentUser:currentUser, onAceitar:aceitarTermosFerramentaria, logout:logout}});
  }

  var detailDemanda = detailId ? demandas.find(function(d){ return d.id===detailId; }) : null;

  var page = route.page;
  var pageEl =
    page==="inicio" ? e(PageInicio) :
    page==="dashboard" ? e(PageDashboardAnalytics) :
    page==="projetos" ? e(PageProjetos) :
    page==="projeto" ? e(PageProjetoBoard, {projectId:route.projectId, tab:route.projectTab}) :
    page==="todas" ? e(PageDemandasList, {title:"Todas as Demandas", rows:demandas}) :
    page==="minhas" ? e(PageDemandasList, {title:"Minhas Demandas", rows:demandas.filter(function(d){return d.responsavelId===CURRENT_USER_ID;})}) :
    page==="revisao" ? e(PageDemandasList, {title:"Em Revisão", rows:demandas.filter(function(d){return d.status==="EM_REVISAO";}), allowKanban:false}) :
    page==="concluidos" ? e(PageDemandasList, {title:"Concluídos", rows:demandas.filter(function(d){return d.status==="CONCLUIDO";}), allowKanban:false}) :
    page==="calendario" ? e(PageCalendarioGlobal) :
    page==="pendencias" ? e(PagePendencias) :
    page==="equipe" ? e(PageEquipe) :
    page==="config" ? e(PageConfiguracoes) :
    page==="ajuda" ? e(PageAjuda) :
    page==="perfil" ? e(PagePerfil) :
    page==="ferr_dashboard" ? e(PageFerramentariaDashboard) :
    page==="ferr_catalogo" ? e(PageFerramentas) :
    page==="ferr_retiradas" ? e(PageRetiradasReservas) :
    page==="ferr_manutencao" ? e(PageFerramentariaEmConstrucao, {titulo:"Manutenção"}) :
    page==="ferr_equipamentos" ? e(PageFerramentariaEmConstrucao, {titulo:"Escritório"}) :
    page==="ferr_calendario" ? e(PageFerramentariaEmConstrucao, {titulo:"Calendário"}) :
    page==="ferr_equipe" ? e(PageFerramentariaEmConstrucao, {titulo:"Equipe"}) :
    (workspace==="ferramentaria" ? e(PageFerramentariaDashboard) : e(PageInicio));

  return e(AppContext.Provider, {value:ctxValue},
    e("div", {className:"app"},
      e(Sidebar),
      e("div", {className:"main-col"},
        e(Header),
        e("div", {className:"content"}, pageEl)
      )
    ),
    modal && modal.type==="novaDemanda" ? e(NovaDemandaModal, {projetoIdFixo:modal.projetoId, onClose:function(){setModal(null);}}) : null,
    modal && modal.type==="novoProjeto" ? e(NovoProjetoModal, {onClose:function(){setModal(null);}}) : null,
    e(DemandDetailPanel, {demanda: detailDemanda, onClose: closeDetail}),
    syncError ? e("div", {style:{position:"fixed", left:"50%", bottom:18, transform:"translateX(-50%)", zIndex:9999,
        background:"#c6392f", color:"#fff", padding:"10px 16px", borderRadius:10, fontSize:13, fontWeight:600,
        boxShadow:"0 12px 30px -10px rgba(0,0,0,.45)", display:"flex", alignItems:"center", gap:10, maxWidth:"90vw"}},
      e(Icon,{name:"alert", size:15}),
      e("span", null, syncError),
      e("button", {onClick:function(){ setSyncError(""); }, style:{background:"transparent", border:"none", color:"#fff", cursor:"pointer", fontSize:16, lineHeight:1, padding:0}}, "×")
    ) : null
  );
}

var rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(e(App));
</script>
